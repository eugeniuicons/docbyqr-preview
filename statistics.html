const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
async function render(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
  const html = new TextDecoder().decode(plain);

  // inserts into this password page instead of replacing it.
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));

  document.querySelectorAll("style, link[rel=stylesheet]").forEach(el => el.remove());

async function derive(password) {

const KEYS = "dbq-keys";
function loadKeys() {
