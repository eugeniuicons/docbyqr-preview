function loadKeys() {
  let keys = {};
  try { keys = JSON.parse(sessionStorage.getItem(KEYS) || "{}") || {}; } catch (_) {}
  try {  // the single key that earlier builds stored
    const legacy = JSON.parse(sessionStorage.getItem("dbq-key") || "null");
    if (legacy && legacy.salt && legacy.key && !keys[legacy.salt]) keys[legacy.salt] = legacy.key;
  } catch (_) {}
  return keys;
}
function saveKey(salt, key) {
  try { const keys = loadKeys(); keys[salt] = key; sessionStorage.setItem(KEYS, JSON.stringify(keys)); } catch (_) {}
}
(async () => {
  const keys = loadKeys();
  if (keys[P.salt]) {
    try { await render(bytes(keys[P.salt])); return; } catch (_) { /* fall through to the form */ }
  }
  const unlockedBefore = Object.keys(keys).length > 0;
  // Unlocked before but not for this build: this copy is probably a stale cached
  // one, so fetch a fresh copy once before asking for the password.
  if (unlockedBefore && !/[?&]fresh=/.test(location.search)) {
    location.replace(location.pathname + "?fresh=" + Date.now() + location.hash);
    return;
  }
  const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
  form.hidden = false;
  document.getElementById("pw").focus();
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try {
      const raw = await derive(document.getElementById("pw").value);
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));  // throws if wrong
      saveKey(P.salt, toB64(raw));
      // The first unlock in a tab starts on the overview, whichever page the link pointed at.
      const page = location.pathname.split("/").pop();
      if (!unlockedBefore && page && page !== "index.html") { location.replace("./?v=1793110525"); return; }
      await render(raw);
    } catch (e) {
      err.textContent = "That password is not right. Try again.";
      go.disabled = false; go.textContent = "Open";
    }
  });
})();
</script>
