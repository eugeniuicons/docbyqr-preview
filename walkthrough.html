<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DocByQR · Design preview</title>
<link rel="icon" type="image/svg+xml" href="brand/docbyqr-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body.gate { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #F6F7F9; color: #263238; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; }
  .gate form { width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 28px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 10px; }
  .gate form[hidden] { display: none; }
  .gate .head { display: flex; align-items: center; gap: 12px; }
  .gate h1 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .gate p { margin: 0; color: #546E7A; }
  .gate label { font-size: 13px; line-height: 18px; font-weight: 500; }
  .gate input { box-sizing: border-box; width: 100%; height: 40px; margin-top: 6px; padding: 0 12px; border: 1px solid #CFD8DC; border-radius: 6px; font: inherit; color: #263238; }
  .gate input:focus { outline: 2px solid #6C47D8; outline-offset: 2px; border-color: #6C47D8; }
  .gate button { height: 40px; border: 1px solid #6C47D8; border-radius: 6px; background: #6C47D8; color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer; }
  .gate button:disabled { opacity: 0.6; cursor: progress; }
  .gate .error { color: #C62828; font-size: 13px; line-height: 18px; min-height: 18px; }
</style>
</head>
<body class="gate">
<form id="gate" hidden>
  <div class="head">
    <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path fill="#6C47D8" fill-rule="evenodd" d="M8 0h8a8 8 0 0 1 8 8v8a8 8 0 0 1-8 8H0V8h8zm0 8v8h8V8z"/><path fill="#6C47D8" fill-rule="evenodd" d="M9.5 9.5h5v5h-5zm1.5 1.5v2h2v-2z"/></svg>
    <h1>DocByQR design preview</h1>
  </div>
  <p>This preview is private. Enter the password you were given.</p>
  <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus required></div>
  <div class="error" id="err" role="alert"></div>
  <button id="go" type="submit">Open</button>
</form>
<script>
const P = {"salt": "7FbvgMarN5/NaxqoIXknmg==", "iter": 600000, "iv": "x653LqhP4/P2WV8G", "ct": "m0JXu2oEkyWC2+gAx6KBdTmAciPuzImPZlDS9q6Ec4rB9WD6xf7YC8xco8Ne5KW5ZXZqjYJR+t7AdvkbXVazFvyRQN/xa3KDA7V2pWVZ9JyR1wbiQv0dC4rQWqB8Y+vUyCul0dPpSaMNVlsYQZ+L/qvmrAMCj4KnxJozP9YTBgG4liUv8BFeUpUcSwtTnW5KISaKZmd7nG8azI/KEXygFLP4XHrhyU4DcOjG4hk4M95L51ztbkDGrLmiklcx9Qt6JpojyXIhcRSG14hUKlzbGRlKgqg37IK0wfMdV4uoRx3Do6B8q0TT"};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
async function render(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
  const html = new TextDecoder().decode(plain);
  // Replace the page only after it has finished parsing; otherwise document.write
  // inserts into this password page instead of replacing it.
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));
  // Drop the password page's own styles first; some browsers keep them after document.open.
  document.querySelectorAll("style, link[rel=stylesheet]").forEach(el => el.remove());
  document.body.className = "";
  document.open(); document.write(html); document.close();
}
async function derive(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
}
(async () => {
  try {
    const saved = JSON.parse(sessionStorage.getItem("dbq-key") || "null");
    if (saved && saved.salt === P.salt) { await render(bytes(saved.key)); return; }
  } catch (e) { try { sessionStorage.removeItem("dbq-key"); } catch (_) {} }
  const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
  form.hidden = false;
  document.getElementById("pw").focus();
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try {
      const raw = await derive(document.getElementById("pw").value);
      try { sessionStorage.setItem("dbq-key", JSON.stringify({ salt: P.salt, key: toB64(raw) })); } catch (_) {}
      await render(raw);
    } catch (e) {
      try { sessionStorage.removeItem("dbq-key"); } catch (_) {}
      err.textContent = "That password is not right. Try again.";
      go.disabled = false; go.textContent = "Open";
    }
  });
})();
</script>
</body>
</html>
