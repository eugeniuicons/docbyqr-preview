const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
async function render(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function derive(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
}
(async () => {
  try {
    const saved = JSON.parse(sessionStorage.getItem("dbq-key") || "null");
    if (saved && saved.salt === P.salt) { await render(bytes(saved.key)); return; }
  } catch (e) { try { sessionStorage.removeItem("dbq-key"); } catch (_) {} }
  const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
  form.hidden = false;
  document.getElementById("pw").focus();
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try {
      const raw = await derive(document.getElementById("pw").value);
      try { sessionStorage.setItem("dbq-key", JSON.stringify({ salt: P.salt, key: toB64(raw) })); } catch (_) {}
      await render(raw);
    } catch (e) {
      try { sessionStorage.removeItem("dbq-key"); } catch (_) {}
      err.textContent = "That password is not right. Try again.";
      go.disabled = false; go.textContent = "Open";
    }
  });
})();
